# Builds koboldcpp-nocuda.exe (Vulkan + CPU, what Keith's launcher runs) from
# this fork, with ZBot's patch applied. Goes in the fork as
# .github/workflows/zbot-build-windows.yml.
#
# The steps are KoboldCpp's own (kcpp-build-release-win.yaml) without the CUDA
# build, the Visual Studio reinstall it needs and the release upload. On a
# public fork, Actions minutes are free.
name: ZBot KoboldCpp (Windows, no CUDA)
on:
  workflow_dispatch:
  push:
    branches: [zbot]

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: 3.8.10

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter==5.2.0 pyinstaller==5.12.0 psutil==5.9.5 jinja2==3.1.6

      - name: Download and install w64devkit
        run: |
          curl -L https://github.com/skeeto/w64devkit/releases/download/v1.22.0/w64devkit-1.22.0.zip --output w64devkit.zip
          Expand-Archive w64devkit.zip -DestinationPath .

      - name: Add w64devkit to PATH
        run: |
          echo "$(Get-Location)\w64devkit\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Build (Vulkan and CPU)
        run: |
          make LLAMA_VULKAN=1 LLAMA_PORTABLE=1 -j ${env:NUMBER_OF_PROCESSORS}

      - name: Package koboldcpp-nocuda.exe
        run: |
          ./make_pyinstaller.bat

      - uses: actions/upload-artifact@v6
        with:
          name: koboldcpp-nocuda-zbot
          path: dist/koboldcpp-nocuda.exe
          retention-days: 7
